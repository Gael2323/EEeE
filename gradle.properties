# CONFIGURACION PARA SOLUCIONAR EL ERROR DE JAVA 25
# ====================================================================

# Como Java 25 rompe Gradle, esta es la ruta forzada a Java 21.
# ATENCION: El nombre exacto de la carpeta puede variar un poco en tu PC
# y en la de tu amigo (por ejemplo, jdk-21.0.3 o jdk-21.0.4).
# Tienen que ir a "C:\Program Files\Eclipse Adoptium\" a revisar el 
# nombre exacto de la carpeta y ponerlo aqui si les tira error.
# OJO: Los separadores de la ruta deben ser / en lugar de \

# Descomentá (quitá el #) de la siguiente línea y poné tu ruta:
# org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.x.x.x-hotspot
